<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>حساب المدخول اليومي</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}

.container{
    max-width:500px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
    color:#222;
}

input{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    background:#2196F3;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

.result{
    margin-top:20px;
    background:#f0f7ff;
    padding:15px;
    border-radius:10px;
}

.result p{
    font-size:18px;
    margin:8px 0;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

table th,
table td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

table th{
    background:#2196F3;
    color:white;
}

.delete-btn{
    background:#f44336;
    padding:6px 10px;
    font-size:14px;
    border-radius:6px;
}

.total-box{
    margin-top:20px;
    background:#e8f5e9;
    padding:15px;
    border-radius:10px;
    font-size:20px;
    text-align:center;
    font-weight:bold;
}

</style>
</head>
<body>

<div class="container">

<h1>حساب المدخول اليومي</h1>

<input type="number" id="totalOrders" placeholder="مجموع الطلبات">

<input type="number" id="returnedOrders" placeholder="قيمة الراجع">

<input type="number" id="expenses" placeholder="المصاريف">

<button onclick="calculateIncome()">
احسب واحفظ
</button>

<div class="result" id="result" style="display:none;">

<p id="netIncome"></p>

<p id="returnPercent"></p>

</div>

<div class="total-box" id="monthlyTotal">
إجمالي الأرباح: 0 دج
</div>

<table>

<thead>
<tr>
<th>التاريخ</th>
<th>المجموع</th>
<th>الراجع</th>
<th>المصاريف</th>
<th>الصافي</th>
<th>حذف</th>
</tr>
</thead>

<tbody id="recordsTable">
</tbody>

</table>

</div>

<script>

let records = JSON.parse(localStorage.getItem("records")) || [];

displayRecords();

function calculateIncome(){

    const total =
        parseFloat(document.getElementById("totalOrders").value) || 0;

    const returned =
        parseFloat(document.getElementById("returnedOrders").value) || 0;

    const expenses =
        parseFloat(document.getElementById("expenses").value) || 0;

    const net = total - returned - expenses;

    const percent =
        total > 0 ? ((returned / total) * 100).toFixed(2) : 0;

    document.getElementById("result").style.display = "block";

    document.getElementById("netIncome").innerHTML =
        "المدخول الصافي: <strong>" + net.toFixed(2) + " دج</strong>";

    document.getElementById("returnPercent").innerHTML =
        "نسبة الراجع: <strong>" + percent + "%</strong>";

    const today = new Date().toLocaleDateString("ar-DZ");

    const record = {
        date: today,
        total: total,
        returned: returned,
        expenses: expenses,
        net: net
    };

    records.push(record);

    localStorage.setItem("records", JSON.stringify(records));

    displayRecords();

    clearInputs();
}

function displayRecords(){

    const table = document.getElementById("recordsTable");

    table.innerHTML = "";

    let monthlyTotal = 0;

    records.forEach((record, index) => {

        monthlyTotal += record.net;

        table.innerHTML += `
        <tr>
            <td>${record.date}</td>
            <td>${record.total}</td>
            <td>${record.returned}</td>
            <td>${record.expenses}</td>
            <td>${record.net.toFixed(2)}</td>
            <td>
                <button class="delete-btn"
                    onclick="deleteRecord(${index})">
                    حذف
                </button>
            </td>
        </tr>
        `;
    });

    document.getElementById("monthlyTotal").innerHTML =
        "إجمالي الأرباح: " + monthlyTotal.toFixed(2) + " دج";
}

function deleteRecord(index){

    records.splice(index, 1);

    localStorage.setItem("records", JSON.stringify(records));

    displayRecords();
}

function clearInputs(){

    document.getElementById("totalOrders").value = "";

    document.getElementById("returnedOrders").value = "";

    document.getElementById("expenses").value = "";
}

</script>

</body>
</html>
